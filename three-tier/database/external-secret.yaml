apiVersion: external-secrets.io/v1alpha1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: nodejs-three-tier-dev/database/credentials-v3
        property: host
    - secretKey: DB_USER
      remoteRef:
        key: nodejs-three-tier-dev/database/credentials-v3
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: nodejs-three-tier-dev/database/credentials-v3
        property: password
    - secretKey: DB_NAME
      remoteRef:
        key: nodejs-three-tier-dev/database/credentials-v3
        property: database
