
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: grafana
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: "14.0.1"

    helm:
      releaseName: grafana

      values: |
        replicas: 1

        deploymentStrategy:
          type: Recreate

        service:
          type: ClusterIP
          port: 80

        serviceAccount:
          create: true
          name: grafana
          automountServiceAccountToken: true

        persistence:
          type: pvc
          enabled: true
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          size: 10Gi

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: CloudWatch
                type: cloudwatch
                access: proxy
                isDefault: true
                editable: false
                jsonData:
                  authType: default
                  defaultRegion: us-east-1

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
