name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment to Destroy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stage

env:
  TF_ROOT: infra/terraform
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: nodejs-three-tier-dev-eks

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: ${{ inputs.environment }}

    steps:

      # --------------------------------------------------
      # 1. Checkout Code
      # --------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Configure AWS Credentials
      # --------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::901602271390:role/TerraformRepo-GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------
      # 3. Setup Terraform
      # --------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------
      # 4. Terraform Init
      # --------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init \
            -backend-config=../environments/${{ inputs.environment }}/backend.tfvars


      # --------------------------------------------------
      # 5. Configure kubectl
      # --------------------------------------------------
      - name: Configure kubectl
        run: |
          echo "Connecting to EKS cluster..."
          echo "Cluster: ${{ env.EKS_CLUSTER_NAME }}"

          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name "${{ env.EKS_CLUSTER_NAME }}"


      # --------------------------------------------------
      # 6. Check Kubernetes Cluster
      # --------------------------------------------------
      - name: Check Kubernetes Resources
        run: |
          echo "=========================================="
          echo "Kubernetes Nodes"
          echo "=========================================="

          kubectl get nodes

          echo ""
          echo "=========================================="
          echo "LoadBalancer Services"
          echo "=========================================="

          kubectl get svc -A \
            --field-selector spec.type=LoadBalancer || true


      # --------------------------------------------------
      # 7. Delete Argo CD Application
      # --------------------------------------------------
      - name: Delete Argo CD Application
        run: |
          echo "Deleting Argo CD Application..."

          kubectl delete application three-tier-dev \
            -n argocd \
            --ignore-not-found=true || true


      # --------------------------------------------------
      # 8. Delete Frontend LoadBalancer
      # --------------------------------------------------
      - name: Delete Frontend LoadBalancer
        run: |
          echo "Deleting frontend LoadBalancer..."

          kubectl delete service frontend-service \
            -n default \
            --ignore-not-found=true || true


      # --------------------------------------------------
      # 9. Delete Argo CD LoadBalancer
      # --------------------------------------------------
      - name: Delete Argo CD LoadBalancer
        run: |
          echo "Deleting Argo CD LoadBalancer..."

          kubectl delete service argocd-server \
            -n argocd \
            --ignore-not-found=true || true


      # --------------------------------------------------
      # 10. Wait for LoadBalancers to be Removed
      # --------------------------------------------------
      - name: Wait for LoadBalancers
        run: |
          echo "Waiting for Kubernetes LoadBalancers to disappear..."

          for i in {1..30}; do

            echo ""
            echo "Check $i/30"

            COUNT=$(kubectl get svc -A \
              --field-selector spec.type=LoadBalancer \
              --no-headers 2>/dev/null | wc -l)

            echo "Remaining LoadBalancer services: $COUNT"

            if [ "$COUNT" -eq 0 ]; then
              echo ""
              echo "All Kubernetes LoadBalancer services are deleted."
              break
            fi

            sleep 10

          done


      # --------------------------------------------------
      # 11. Check Remaining Kubernetes Resources
      # --------------------------------------------------
      - name: Check Remaining Kubernetes Resources
        run: |
          echo "=========================================="
          echo "Remaining Services"
          echo "=========================================="

          kubectl get svc -A || true

          echo ""
          echo "=========================================="
          echo "Remaining Pods"
          echo "=========================================="

          kubectl get pods -A || true


      # --------------------------------------------------
      # 12. Terraform Destroy
      # --------------------------------------------------
      - name: Terraform Destroy
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform destroy \
            -auto-approve \
            -var-file=../environments/${{ inputs.environment }}/terraform.tfvars
