name: CI-CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stage

jobs:
  build-and-push:
    name: Build, Push and Configure Argo CD
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:

      # -----------------------------
      # Checkout
      # -----------------------------

      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # SonarQube
      # -----------------------------

      # - name: SonarQube Scan
      #   run: npx @sonar/scan \
      #     -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
      #     -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
      #     -Dsonar.projectKey=nodejs-three-tier

      # - name: SonarQube Quality Gate
      #   uses: SonarSource/sonarqube-quality-gate-action@v1
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # -----------------------------
      # Debug GitHub
      # -----------------------------

      - name: Debug GitHub context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Actor: $GITHUB_ACTOR"

      # -----------------------------
      # AWS OIDC
      # -----------------------------

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::901602271390:role/TerraformRepo-GitHubActionsRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # -----------------------------
      # Environment
      # -----------------------------

      - name: Print selected environment
        run: |
          echo "Selected environment: ${{ github.event.inputs.environment }}"

      # -----------------------------
      # Configure kubectl
      # -----------------------------

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name nodejs-three-tier-dev-eks

      - name: Verify EKS connection
        run: |
          kubectl get nodes

      # -----------------------------
      # Install Argo CD
      # -----------------------------

      - name: Install Argo CD
        run: |
          kubectl create namespace argocd \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl apply \
            -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

          kubectl wait \
            --for=condition=Available \
            deployment/argocd-server \
            -n argocd \
            --timeout=300s

      # -----------------------------
      # Verify Argo CD
      # -----------------------------

      - name: Verify Argo CD
        run: |
          kubectl get pods -n argocd
          kubectl get svc -n argocd

      # -----------------------------
      # Configure GitHub Repository
      # -----------------------------

      - name: Configure Argo CD GitHub repository
        run: |
          kubectl create secret generic github-repo \
            --namespace argocd \
            --from-literal=type=git \
            --from-literal=url=https://github.com/Challa-Saikumar/Terraform-repo.git \
            --from-literal=username="${{ secrets.ARGOCD_GITHUB_USERNAME }}" \
            --from-literal=password="${{ secrets.ARGOCD_GITHUB_TOKEN }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl label secret github-repo \
            -n argocd \
            argocd.argoproj.io/secret-type=repository \
            --overwrite

      # -----------------------------
      # ECR Login
      # -----------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------
      # Trivy
      # -----------------------------

      # - name: Install Trivy
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y wget gnupg
      #
      #     wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
      #       | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
      #
      #     echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
      #       https://aquasecurity.github.io/trivy-repo/deb generic main" \
      #       | sudo tee /etc/apt/sources.list.d/trivy.list
      #
      #     sudo apt-get update
      #     sudo apt-get install -y trivy

      # -----------------------------
      # Backend
      # -----------------------------

      - name: Build backend image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:backend-${{ github.sha }} \
            ./three-tier/backend

      - name: Push backend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:backend-${{ github.sha }}

      # -----------------------------
      # Frontend
      # -----------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:frontend-${{ github.sha }} \
            ./three-tier/frontend

      - name: Push frontend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:frontend-${{ github.sha }}

      # -----------------------------
      # Update GitOps Image Tags
      # -----------------------------

      - name: Update backend image tag
        run: |
          sed -i "s|image: .*nodejs-three-tier-dev-app:backend.*|image: ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:backend-${{ github.sha }}|" \
            k8s/dev/backend-deployment.yaml

      - name: Update frontend image tag
        run: |
          sed -i "s|image: .*nodejs-three-tier-dev-app:frontend.*|image: ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:frontend-${{ github.sha }}|" \
            k8s/dev/frontend-deployment.yaml

      # -----------------------------
      # Show Changes
      # -----------------------------

      - name: Show GitOps changes
        run: |
          echo "Backend deployment:"
          grep "image:" k8s/dev/backend-deployment.yaml

          echo "Frontend deployment:"
          grep "image:" k8s/dev/frontend-deployment.yaml

      # -----------------------------
      # Commit and Push GitOps Changes
      # -----------------------------

      - name: Commit and push GitOps changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/dev/backend-deployment.yaml
          git add k8s/dev/frontend-deployment.yaml

          git commit \
            -m "Update application images to ${GITHUB_SHA}" \
            || echo "No changes to commit"

          git push origin HEAD:${GITHUB_REF_NAME}

      # -----------------------------
      # Create Argo CD Application
      # -----------------------------

      - name: Create Argo CD Application
        run: |
          kubectl apply \
            -f k8s/argocd/dev-application.yaml

      # -----------------------------
      # Verify Argo CD Application
      # -----------------------------

      - name: Verify Argo CD Application
        run: |
          kubectl get application \
            -n argocd \
            three-tier-dev

          kubectl get application \
            -n argocd \
            three-tier-dev \
            -o wide

      # -----------------------------
      # Pipeline Completed
      # -----------------------------

      - name: Pipeline completed
        run: |
          echo "=========================================="
          echo "CI/CD PIPELINE COMPLETED"
          echo "=========================================="
          echo ""
          echo "Backend image:"
          echo "${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:backend-${{ github.sha }}"
          echo ""
          echo "Frontend image:"
          echo "${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:frontend-${{ github.sha }}"
          echo ""
          echo "GitOps manifests updated."
          echo "Argo CD Application created/updated."
          echo "Argo CD will deploy the application to EKS."
