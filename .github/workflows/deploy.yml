name: CI-CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stage

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      # -----------------------------
      # Checkout
      # -----------------------------

      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # SonarQube
      # -----------------------------

      # - name: SonarQube Scan
      #   run: npx @sonar/scan \
      #     -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
      #     -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
      #     -Dsonar.projectKey=nodejs-three-tier

      # - name: SonarQube Quality Gate
      #   uses: SonarSource/sonarqube-quality-gate-action@v1
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # -----------------------------
      # Debug GitHub
      # -----------------------------

      - name: Debug GitHub context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Actor: $GITHUB_ACTOR"

      # -----------------------------
      # AWS OIDC
      # -----------------------------

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::901602271390:role/TerraformRepo-GitHubActionsRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # -----------------------------
      # Environment
      # -----------------------------

      - name: Print selected environment
        run: |
          echo "Deploying to ${{ github.event.inputs.environment }} environment"

      # -----------------------------
      # ECR Login
      # -----------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------
      # Trivy
      # -----------------------------

      # - name: Install Trivy
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y wget gnupg
      #     wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
      #       | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
      #
      #     echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
      #       https://aquasecurity.github.io/trivy-repo/deb generic main" \
      #       | sudo tee /etc/apt/sources.list.d/trivy.list
      #
      #     sudo apt-get update
      #     sudo apt-get install -y trivy

      # -----------------------------
      # Backend
      # -----------------------------

      - name: Build backend image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:backend-${{ github.sha }} \
            ./three-tier/backend

      - name: Push backend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:backend-${{ github.sha }}

      # -----------------------------
      # Frontend
      # -----------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:frontend-${{ github.sha }} \
            ./three-tier/frontend

      - name: Push frontend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:frontend-${{ github.sha }}

      # -----------------------------
      # Deployment
      # -----------------------------
      #
      # Deployment is intentionally NOT
      # performed by GitHub Actions.
      #
      # Argo CD will deploy the
      # Kubernetes manifests to EKS.
      #
      # -----------------------------

      - name: Build completed
        run: |
          echo "Backend image:"
          echo "${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:backend-${{ github.sha }}"

          echo "Frontend image:"
          echo "${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:frontend-${{ github.sha }}"

          echo "Images pushed successfully."
          echo "Argo CD will handle deployment to EKS."

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name nodejs-three-tier-dev-eks

      - name: Install Argo CD
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply \
            -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

          kubectl wait \
            --for=condition=Available \
            deployment/argocd-server \
            -n argocd \
            --timeout=300s

      - name: Verify Argo CD
        run: |
          kubectl get pods -n argocd
          kubectl get svc -n argocd

      - name: Create Argo CD Application
        run: |
          kubectl apply -f k8s/argocd/dev-application.yaml
        
