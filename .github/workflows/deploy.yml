name: CI-CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stage

jobs:
  build-and-push:
    name: Build, Push and Configure Argo CD
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug GitHub context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Actor: $GITHUB_ACTOR"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::901602271390:role/TerraformRepo-GitHubActionsRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Print selected environment
        run: echo "Selected environment: ${{ inputs.environment }}"

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-1 --name nodejs-three-tier-dev-eks

      - name: Verify EKS connection
        run: kubectl get nodes

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.17.3"

      - name: Install External Secrets Operator
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update
          helm upgrade --install external-secrets external-secrets/external-secrets --namespace external-secrets --create-namespace --wait --timeout 5m

      - name: Create Argo CD namespace
        run: kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

      - name: Install Argo CD
        run: kubectl apply --server-side --force-conflicts -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

      - name: Wait for Argo CD
        run: kubectl wait --for=condition=Available deployment/argocd-server -n argocd --timeout=300s

      - name: Verify Argo CD
        run: kubectl get pods -n argocd

      - name: Configure Argo CD GitHub repository
        env:
          ARGOCD_GITHUB_USERNAME: ${{ secrets.ARGOCD_GITHUB_USERNAME }}
          ARGOCD_GITHUB_TOKEN: ${{ secrets.ARGOCD_GITHUB_TOKEN }}
        run: |
          kubectl create secret generic github-repo --namespace argocd --from-literal=type=git --from-literal=url=https://github.com/Challa-Saikumar/Terraform-repo.git --from-literal=username="$ARGOCD_GITHUB_USERNAME" --from-literal=password="$ARGOCD_GITHUB_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
          kubectl label secret github-repo -n argocd argocd.argoproj.io/secret-type=repository --overwrite

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:backend-${{ github.sha }} ./three-tier/backend
          docker push ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:backend-${{ github.sha }}

      - name: Build and Push Frontend Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:frontend-${{ github.sha }} ./three-tier/frontend
          docker push ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:frontend-${{ github.sha }}

      - name: Update deployment image tags in Git
        run: |
          sed -i "s|image: .*nodejs-three-tier-dev-app:backend.*|image: ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:backend-${{ github.sha }}|" k8s/dev/backend-deployment.yaml
          sed -i "s|image: .*nodejs-three-tier-dev-app:frontend.*|image: ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:frontend-${{ github.sha }}|" k8s/dev/frontend-deployment.yaml

      - name: Commit and push GitOps changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/dev/backend-deployment.yaml k8s/dev/frontend-deployment.yaml
          git commit -m "Update application images to ${GITHUB_SHA}" || echo "No changes to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create Argo CD Application
        run: kubectl apply -f k8s/argocd/dev-application.yaml

      - name: Refresh Argo CD application
        run: kubectl annotate application three-tier-dev -n argocd argocd.argoproj.io/refresh=hard --overwrite

      - name: Verify Argo CD Application
        run: kubectl get application three-tier-dev -n argocd -o wide
