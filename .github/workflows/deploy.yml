name: CI-CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stage

jobs:

  build-and-push:
    name: Build, Push and Configure Argo CD
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:

      # --------------------------------------------------
      # 1. Checkout Repository
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Debug GitHub Context
      # --------------------------------------------------
      - name: Debug GitHub context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Actor: $GITHUB_ACTOR"
      # --------------------------------------------------
      # 3. Configure AWS using GitHub OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::901602271390:role/TerraformRepo-GitHubActionsRole
          aws-region: us-east-1


      # --------------------------------------------------
      # 4. Verify AWS
      # --------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity
      # --------------------------------------------------
      # 5. Show Selected Environment
      # --------------------------------------------------
      - name: Print selected environment
        run: |
          echo "Selected environment: ${{ github.event.inputs.environment }}"
      # --------------------------------------------------
      # 6. Configure kubectl for EKS
      # --------------------------------------------------
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name nodejs-three-tier-dev-eks
      # --------------------------------------------------
      # 7. Verify EKS Connection and Helm
      # --------------------------------------------------
      - name: Verify EKS connection
        run: |
          kubectl get nodes
      # --------------------------------------------------
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "3.17.3"

            # Create monitoring namespace
      - name: Create Monitoring namespace
        run: |
          kubectl create namespace monitoring \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Install External Secrets Operator
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update
          helm upgrade --install external-secrets external-secrets/external-secrets --namespace external-secrets --create-namespace --wait --timeout 5m
      # 8. Create Argo CD Namespace
      # --------------------------------------------------
      - name: Create Argo CD namespace
        run: |
          kubectl create namespace argocd \
            --dry-run=client \
            -o yaml | kubectl apply -f -
      # --------------------------------------------------
      # 9. Install Argo CD
      #
      # IMPORTANT:
      # --server-side avoids the
      # "metadata.annotations: Too long" error
      # --------------------------------------------------
      - name: Install Argo CD
        run: |
          kubectl apply \
            --server-side \
            --force-conflicts \
            -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      # --------------------------------------------------
      # 10. Wait for Argo CD Server
      # --------------------------------------------------
      - name: Wait for Argo CD
        run: |
          kubectl wait \
            --for=condition=Available \
            deployment/argocd-server \
            -n argocd \
            --timeout=300s
      # --------------------------------------------------
      # 11. Verify Argo CD
      # --------------------------------------------------
      - name: Verify Argo CD
        run: |
          echo "Argo CD Pods:"
          kubectl get pods -n argocd
          echo ""
          echo "Argo CD Services:"
          kubectl get svc -n argocd
          echo ""
          echo "Argo CD CRDs:"
          kubectl get crd | grep argoproj.io
      # --------------------------------------------------
      # 12. Configure GitHub Repository for Argo CD
      # --------------------------------------------------
      - name: Configure Argo CD GitHub repository
        run: |
          kubectl create secret generic github-repo \
            --namespace argocd \
            --from-literal=type=git \
            --from-literal=url=https://github.com/Challa-Saikumar/Terraform-repo.git \
            --from-literal=username="${{ secrets.ARGOCD_GITHUB_USERNAME }}" \
            --from-literal=password="${{ secrets.ARGOCD_GITHUB_TOKEN }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -
          kubectl label secret github-repo \
            -n argocd \
            argocd.argoproj.io/secret-type=repository \
            --overwrite
      # --------------------------------------------------
      # 13. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------
      # 14. Build Backend Image
      # --------------------------------------------------
      - name: Build backend image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:backend-${{ github.sha }} \
            ./three-tier/backend
      # --------------------------------------------------
      # 15. Push Backend Image
      # --------------------------------------------------
      - name: Push backend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:backend-${{ github.sha }}
      # --------------------------------------------------
      # 16. Build Frontend Image
      # --------------------------------------------------
      - name: Build frontend image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:frontend-${{ github.sha }} \
            ./three-tier/frontend
      # --------------------------------------------------
      # 17. Push Frontend Image
      # --------------------------------------------------
      - name: Push frontend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:frontend-${{ github.sha }}
      # --------------------------------------------------
      # 18. Update Backend Image Tag in Git
      # --------------------------------------------------
      - name: Update backend image tag
        run: |
          sed -i "s|image: .*nodejs-three-tier-dev-app:backend.*|image: ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:backend-${{ github.sha }}|" \
            k8s/dev/backend-deployment.yaml
      # --------------------------------------------------
      # 19. Update Frontend Image Tag in Git
      # --------------------------------------------------
      - name: Update frontend image tag
        run: |
          sed -i "s|image: .*nodejs-three-tier-dev-app:frontend.*|image: ${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:frontend-${{ github.sha }}|" \
            k8s/dev/frontend-deployment.yaml
      # --------------------------------------------------
      # 20. Show GitOps Changes
      # --------------------------------------------------
      - name: Show GitOps changes
        run: |
          echo "=========================================="
          echo "Backend deployment image:"
          grep "image:" k8s/dev/backend-deployment.yaml
          echo ""
          echo "Frontend deployment image:"
          grep "image:" k8s/dev/frontend-deployment.yaml
          echo "=========================================="
      # --------------------------------------------------
      # 21. Commit and Push GitOps Changes
      # --------------------------------------------------
      - name: Commit and push GitOps changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/dev/backend-deployment.yaml
          git add k8s/dev/frontend-deployment.yaml

          git diff --cached --quiet || \
          git commit -m "Update application images to ${GITHUB_SHA}"

          git pull --rebase origin ${GITHUB_REF_NAME}

          git push origin HEAD:${GITHUB_REF_NAME}
      
      # --------------------------------------------------
      # 22. Create Argo CD Application
      # --------------------------------------------------
      - name: Create Argo CD Application
        run: |
          kubectl apply \
            -f k8s/argocd/dev-application.yaml
      # --------------------------------------------------
      # 23. Verify Argo CD Application
      # --------------------------------------------------
      - name: Verify Argo CD Application
        run: |
          echo "Argo CD Application:"
          kubectl get application \
            -n argocd \
            three-tier-dev
          echo ""
          echo "Application details:"
          kubectl get application \
            -n argocd \
            three-tier-dev \
            -o wide

      - name: Create and Verify GP3 StorageClass
        run: |
          echo "Creating GP3 StorageClass..."

          cat <<EOF | kubectl apply -f -
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: gp3
          provisioner: ebs.csi.aws.com
          parameters:
            type: gp3
            fsType: ext4
            encrypted: "true"
          reclaimPolicy: Retain
          allowVolumeExpansion: true
          volumeBindingMode: WaitForFirstConsumer
          EOF

          echo "Available Storage Classes:"
          kubectl get storageclass

          echo "Verifying GP3:"
          kubectl get storageclass gp3

          echo "Verifying EBS CSI Driver:"
          kubectl get csidriver ebs.csi.aws.com
          
      - name: Deploy Grafana Application
        run: |
          echo "Creating Grafana Argo CD Application..."

          kubectl apply \
            -f k8s/argocd/grafana-application.yaml

          echo "Grafana Argo CD Application created."

      # --------------------------------------------------
      # 24. Verify Grafana Deployment
      # --------------------------------------------------
      - name: Verify Grafana Deployment
        run: |
          echo "Checking Grafana Argo CD Application..."

          kubectl get application grafana -n argocd -o wide

          echo "Waiting for Argo CD to sync Grafana..."

          for i in {1..30}; do
            SYNC_STATUS=$(kubectl get application grafana -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || true)
            HEALTH_STATUS=$(kubectl get application grafana -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || true)

            echo "Sync: ${SYNC_STATUS:-Pending} | Health: ${HEALTH_STATUS:-Pending}"

            if [ "$SYNC_STATUS" = "Synced" ] && [ "$HEALTH_STATUS" = "Healthy" ]; then
              echo "Grafana successfully deployed!"
              break
            fi

            sleep 10
          done

          if [ "$SYNC_STATUS" != "Synced" ] || [ "$HEALTH_STATUS" != "Healthy" ]; then
            echo "Grafana deployment did not become healthy."

            echo "Application details:"
            kubectl describe application grafana -n argocd

            echo "Monitoring namespace:"
            kubectl get all -n monitoring

            echo "PVC status:"
            kubectl get pvc -n monitoring

            exit 1
          fi
      # --------------------------------------------------
      # 24. Final Output
      # --------------------------------------------------
      - name: Pipeline completed
        run: |
          echo ""
          echo "=========================================="
          echo "       CI/CD PIPELINE COMPLETED"
          echo "=========================================="
          echo ""
          echo "Backend image:"
          echo "${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:backend-${{ github.sha }}"
          echo ""
          echo "Frontend image:"
          echo "${{ steps.login-ecr.outputs.registry }}/nodejs-three-tier-dev-app:frontend-${{ github.sha }}"
          echo ""
          echo "GitOps manifests updated."
          echo "Argo CD Application created/updated."
          echo "Argo CD will deploy the application to EKS."
          echo ""
          echo "=========================================="
          
      # --------------------------------------------------
      # 24. Added Slack
      # --------------------------------------------------
      - name: Notify Slack
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MESSAGE="✅ EKS Deployment Successful"
          else
            MESSAGE="❌ EKS Deployment Failed."
          fi

          curl -X POST \
            -H "Content-Type: application/json" \
            --data "{
              \"text\": \"$MESSAGE

              🚀 Repository: ${{ github.repository }}
              🌿 Branch: ${{ github.ref_name }}
              👤 Triggered By: ${{ github.actor }}
              ⚙️ Workflow: ${{ github.workflow }}
              🔗 Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"          

